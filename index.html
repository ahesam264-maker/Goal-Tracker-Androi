        g.status='archived'; state.activeGoalId=null; save(); toast('به آرشیو منتقل شد','archive'); goView('home'); renderHome();
      }
    };
    $('#m-delete').onclick=async ()=>{
      const ok=await modal({title:'حذف کامل مسیر', msg:'«'+g.name+'» و همه روزها، وظایف و گزارش‌هایش برای همیشه حذف می‌شود. این کار قابل بازگشت نیست!', danger:true, okTxt:'حذف برای همیشه'});
      if(!ok) return;
      const ok2=await modal({title:'مطمئنی؟', msg:'آخرین تأیید — همه اطلاعات این مسیر پاک می‌شود.', danger:true, okTxt:'بله، حذف کن'});
      if(!ok2) return;
      delete state.goals[g.id]; state.activeGoalId=null; save(); toast('مسیر حذف شد','trash'); goView('home'); renderHome();
    };
  }
  const mn=$('#m-new'); if(mn) mn.onclick=()=>{ goView('home'); renderHome(); };
  $('#m-export').onclick=()=>{ download('masir-backup-'+Date.now()+'.json', JSON.stringify(Object.assign({type:'masir-full'},state), null, 2)); toast('فایل پشتیبان دانلود شد'); };
  $('#m-import').onclick=()=>$('#m-file').click();
  $('#m-file').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const txt=await f.text(); const data=JSON.parse(txt);
      let next=null;
      if(data && data.goals) next={v:1, activeGoalId:data.activeGoalId||null, goals:data.goals, timers:{}, settings:Object.assign(defaultState().settings, data.settings||{})};
      else if(data && data.type==='masir-goal' && data.goal){
        next=state; const gl=data.goal; gl.id=gl.id||uid(); if(state.goals[gl.id]) gl.id=uid();
        const okI=await modal({title:'واردکردن مسیر', msg:'مسیر «'+gl.name+'» به برنامه اضافه شود؟', icon:'upload', okTxt:'اضافه کن'});
        if(okI){ gl.status='archived'; state.goals[gl.id]=gl; save(); toast('مسیر وارد شد'); renderMore(); }
        return;
      } else { toast('فایل پشتیبان معتبر نیست','info'); return; }
      const ok=await modal({title:'بازیابی پشتیبان', msg:'اطلاعات فعلی برنامه با نسخه پشتیبان جایگزین می‌شود. ادامه می‌دهی؟', danger:true, icon:'upload', okTxt:'جایگزین کن'});
      if(!ok) return;
      state=next; saveNow(); toast('اطلاعات بازیابی شد'); boot(true);
    }catch(err){ toast('خواندن فایل ممکن نشد','info'); }
    e.target.value='';
  };
  $('#m-sound').onclick=()=>{ state.settings.sound=!state.settings.sound; save(); renderMore(); };
  $('#m-vol').oninput=e=>{ state.settings.volume=clamp(+e.target.value,0,100)/100; save(); };
  $('#m-test').onclick=testSound;
  $('#m-wipe').onclick=async ()=>{
    const ok=await modal({title:'پاک‌سازی کامل', msg:'همه اهداف، گزارش‌ها، تایمرها و تنظیمات برای همیشه حذف می‌شود.', danger:true, okTxt:'حذف همه چیز'});
    if(!ok) return;
    localStorage.removeItem(LS_KEY); state=defaultState(); saveNow(); toast('برنامه بازنشانی شد'); boot(true);
  };
}

/* ================================================================
   BOOT
================================================================ */
function boot(rerender){
  loadState();
  renderNav();
  const g=activeGoal();
  if(g){ goView('path'); renderPath(); }
  else { editGoalId=null; goView('home'); renderHome(); }
  // recover running timers
  for(const id in state.timers){ const t=state.timers[id]; if(t.running){ t.left=Math.max(0,t.endAt-Date.now()); if(t.left<=0){ t.left=0; t.running=false; t.done=true; onTimerEnd(id); } } }
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ tickTimers(); } });
window.addEventListener('beforeunload',saveNow);
window.addEventListener('resize',()=>{ if(curView==='path') renderPath(); });
document.addEventListener('DOMContentLoaded',()=>boot());
</script>

<script>
/* ================================================================
   ANDROID BRIDGE + SCHEDULED ALERTS + LOCAL FONTS + SERVICE WORKER
   (لایه افزودنی — هیچ‌کدام از کدهای قبلی را بازنویسی نمی‌کند)
================================================================ */
(function(){
'use strict';

/* ---------- 1) پل بومی اندروید (MasirNative) ---------- */
function nativeOk(){ try{ return typeof window.MasirNative!=='undefined' && window.MasirNative!==null; }catch(e){ return false; } }
function ncall(fn){
  if(!nativeOk()) return null;
  try{ return window.MasirNative[fn].apply(window.MasirNative, Array.prototype.slice.call(arguments,1)); }
  catch(e){ try{ console.warn('native call failed',fn,e); }catch(_){} return null; }
}
function timerName(id,t){
  if(id==='pomo') return 'پومودورو — '+(t.extra&&t.extra.mode==='focus'?'تمرکز':'استراحت');
  if(id==='med') return 'مدیتیشن';
  if(id==='deep') return 'کار عمیق';
  if(t.label) return t.label;
  return 'تایمر';
}
/* همگام‌سازی خودکار وضعیت تایمر وب با سرویس اندروید (بر اساس امضا) */
window.syncTimerNative=function(id,t){
  if(!nativeOk() || !t) return;
  try{
    const sig = t.running ? ('r|'+t.endAt) : ('p|'+Math.round(t.left/1000));
    if(t._sig===sig) return;
    t._sig=sig;
    if(t.running && t.endAt>Date.now()){
      ncall('startTimer', String(id), String(timerName(id,t)), Number(t.endAt));
    } else if(t.left>0 && t.left<(t.dur||0)){
      ncall('pauseTimer', String(id), Number(Math.round(t.left)));
    } else if(t.left>0){
      /* بازنشانی/توقف کامل توسط کاربر */
      ncall('stopTimer', String(id));
    }
    /* اگر left===0 یعنی تایمر طبیعاً تمام شده؛ خود سرویس اندروید اعلان پایان را می‌سازد */
  }catch(e){}
};
/* بازیابی وضعیت تایمرها از سرویس اندروید (هنگام بازگشت به برنامه یا بارگذاری صفحه) */
function syncFromNative(){
  if(!nativeOk()) return;
  const raw=ncall('getTimerStates');
  if(!raw) return;
  let map; try{ map=JSON.parse(raw); }catch(e){ return; }
  let changed=false;
  for(const id in state.timers){
    const t=state.timers[id]; const n=map[id];
    if(!n) continue;
    if(n.running && n.endAt>Date.now()){
      t.running=true; t.endAt=Number(n.endAt); t.left=Math.max(0,t.endAt-Date.now()); t.done=false;
    } else if(!n.running && typeof n.left==='number' && n.left>0){
      t.running=false; t.left=Number(n.left); t.done=false;
    } else if(n.ended){
      t.running=false; t.left=0; t.done=true;
    }
    t._sig = t.running? ('r|'+t.endAt) : ('p|'+Math.round(t.left/1000));
    changed=true;
  }
  if(changed){ save(); if(curView==='tools'){ renderTools(); } }
}
window.__nativeResume=function(){ syncFromNative(); };
/* فراخوانی‌شده از Kotlin وقتی کاربر از روی اعلان دکمه‌ای می‌زند */
window.MasirNativeAction=function(id,action,payload){
  try{
    if(typeof state==='undefined' || !state) return;
    const t=state.timers[id];
    if(t){
      if(action==='pause'){ t.running=false; t.left=Math.max(0,Number(payload)||t.left); t.done=false; }
      else if(action==='play'){ t.running=true; t.endAt=Number(payload)||Date.now()+t.left; t.done=false; }
      else if(action==='stop'){ t.running=false; t.left=t.dur||t.left; t.done=false; }
      else if(action==='ended'){ t.running=false; t.left=0; t.done=true; }
      t._sig = t.running? ('r|'+t.endAt) : ('p|'+Math.round(t.left/1000));
      save();
      paintTimer(id,t); paintTimerBtn(id,t);
    }
    if(action==='ended'){ Alarm.start('تایمر به پایان رسید'); }
    if(curView==='tools') renderTools();
  }catch(e){}
};

/* ---------- 2) اعلان‌های زمان‌بندی‌شده ---------- */
function alertEpoch(serial,hhmm){
  const g=d2g(serial);
  const p=String(hhmm||'09:00').split(':');
  const h=clamp(parseInt(p[0])||0,0,23), m=clamp(parseInt(p[1])||0,0,59);
  /* ساعت ایران = UTC+3:30 (بدون ساعت تابستانی) */
  return Date.UTC(g.gy, g.gm-1, g.gd, h, m, 0) - (3.5*3600*1000);
}
function syncAlert(a){
  if(!a) return;
  a.epoch=alertEpoch(a.serial,a.time);
  if(nativeOk()){
    if(a.enabled && a.epoch>Date.now()-60000) ncall('scheduleAlert', String(a.id), String(a.title), String(a.desc||''), Number(a.epoch));
    else ncall('cancelAlert', String(a.id));
  }
}
function requestAlertPermission(){
  if(nativeOk()){ ncall('requestNotificationPermission'); toast('درخواست مجوز اعلان ارسال شد'); return; }
  if('Notification' in window){
    try{ Notification.requestPermission().then(p=>toast(p==='granted'?'اجازه نمایش اعلان داده شد':'اجازه داده نشد','bell')); }catch(e){ toast('درخواست مجوز ممکن نشد','info'); }
    return;
  }
  toast('این مرورگر از اعلان پشتیبانی نمی‌کند','info');
}
function requestExactAlarmPermission(){
  if(nativeOk()){ ncall('requestExactAlarm'); toast('صفحه دسترسی «اعلان دقیق» باز شد'); }
  else toast('در نسخه وب این دسترسی لازم نیست','info');
}
/* بررسی اعلان‌ها فقط در نسخه وب (بدون اندروید) و هنگام باز بودن صفحه */
function checkWebAlerts(){
  if(typeof state==='undefined' || !state || !state.alerts) return;
  if(nativeOk() || !state.alerts.length) return;
  const now=Date.now(); let fired=false;
  state.alerts.forEach(a=>{
    if(!a.enabled || a.fired) return;
    if(!a.epoch) a.epoch=alertEpoch(a.serial,a.time);
    if(a.epoch<=now){
      a.fired=now; fired=true;
      Alarm.start('یادآوری: '+a.title);
      toast('یادآوری: '+a.title,'bell');
      if('Notification' in window && Notification.permission==='granted'){ try{ new Notification(a.title,{body:a.desc||'یادآوری برنامه مسیر'}); }catch(e){} }
    }
  });
  if(fired) save();
}
setInterval(checkWebAlerts,2000);

/* ---------- 3) نمای اعلان‌ها ---------- */
let alertEditId=null;
function renderAlerts(){
  const v=$('#view-alerts'); if(!v) return;
  if(!state.alerts) state.alerts=[];
  const now=Date.now();
  const editing=alertEditId? state.alerts.find(a=>a.id===alertEditId) : null;
  const tj=todayJ();
  const nativeMode=nativeOk();
  v.innerHTML=
  '<div class="vhead"><h1>'+ic('bell','sm')+' اعلان‌های زمان‌بندی‌شده</h1></div>'+

  '<div class="banner '+(nativeMode?'green':'blue')+'">'+ic(nativeMode?'bell':'info')+
    '<div>'+(nativeMode?
      'نسخه اندروید فعال است؛ اعلان‌ها توسط سیستم عامل و حتی پس از بستن برنامه نمایش داده می‌شوند.':
      'نسخه وب: اعلان‌ها فقط تا زمانی که این صفحه باز است بررسی می‌شوند. برای اعلان در پس‌زمینه، APK را نصب کن.')+
    '</div></div>'+

  '<div class="card"><h3>'+ic(nativeMode?'check':'plus')+(editing?'ویرایش اعلان':'اعلان جدید')+'</h3>'+
    '<label class="f-label">عنوان اعلان<input class="f-in" id="al-title" maxlength="70" placeholder="مثلاً: زمان ثبت گزارش امروز" value="'+(editing?esc(editing.title):'')+'"></label>'+
    '<label class="f-label">توضیح (اختیاری)<input class="f-in" id="al-desc" maxlength="140" placeholder="متن کوتاه زیر عنوان" value="'+(editing?esc(editing.desc||''):'')+'"></label>'+
    '<div class="f-label">تاریخ (شمسی)</div>'+
    '<div class="date-row"><select class="f-sel" id="al-dd"></select><select class="f-sel" id="al-mm"></select><select class="f-sel" id="al-yy"></select></div>'+
    '<div class="f-label">ساعت (۲۴ ساعته)</div>'+
    '<input class="f-in" id="al-time" type="time" value="'+(editing?esc(editing.time):'09:00')+'">'+
    '<div class="btnrow mt14">'+
      '<button class="btn btn-primary" id="al-save">'+ic('check')+(editing?'ذخیره تغییرات':'ساخت اعلان')+'</button>'+
      (editing?'<button class="btn btn-line" id="al-cancel">انصراف</button>':'')+
    '</div></div>'+

  '<div class="card"><h3>'+ic('volume')+'مجوزها</h3><p class="hint">برای نمایش اعلان بومی، اجازه لازم است.</p>'+
    '<div class="btnrow"><button class="btn btn-ghost" id="al-perm">'+ic('bell')+'اجازه اعلان‌ها</button>'+
    '<button class="btn btn-ghost" id="al-exact">'+ic('clock')+'اعلان دقیق ساعت</button></div>'+
    '<p class="hint" style="margin-top:10px">وضعیت دسترسی دقیق: '+(nativeMode? ((ncall('hasExactAlarm')===false)?'<b style="color:var(--amber)">دست داده نشده</b>':'<b style="color:var(--green)">در دسترس</b>'):'—')+'</p></div>'+

  '<div class="card"><h3>'+ic('listc')+'فهرست اعلان‌ها ('+fa(state.alerts.length)+')</h3>'+
    (state.alerts.length? state.alerts.slice().sort((a,b)=>a.epoch-b.epoch).map(a=>{
      const past=a.epoch<=now, done=!!a.fired;
      return '<div class="arow '+(done?'done':past?'missed':'future')+'" style="cursor:default">'+
        '<div class="an" style="'+(done?'background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff':past?'background:var(--amber-soft);color:var(--amber)':'background:var(--blue-faint);color:var(--blue-dark)')+'">'+ic('bell','sm')+'</div>'+
        '<div class="at"><b>'+esc(a.title)+'</b><span>'+fmtJFull(a.serial)+' — '+fa(a.time)+(a.enabled?'':' · غیرفعال')+(done?' · اجرا شد':past?' · زمان گذشته':'')+'</span></div>'+
        '<span class="tact"><button data-aon="'+a.id+'" title="فعال/غیرفعال" style="color:'+(a.enabled?'var(--green)':'var(--muted)')+'">'+ic(a.enabled?'check':'x','sm')+'</button>'+
        '<button data-aedit="'+a.id+'" title="ویرایش" style="color:var(--blue)">'+ic('pencil','sm')+'</button>'+
        '<button class="del" data-adel="'+a.id+'" title="حذف">'+ic('trash','sm')+'</button></span></div>';
    }).join('') : '<div class="emptyday">'+ic('bell','lg')+'هنوز اعلانی نساخته‌ای.<br>اولین یادآوری‌ات را اضافه کن.</div>')+
  '</div>';

  /* تاریخ شمسی */
  const sD=$('#al-dd'), sM=$('#al-mm'), sY=$('#al-yy');
  const base= editing? d2j(editing.serial) : tj;
  sY.innerHTML=[base.jy-1,base.jy,base.jy+1,base.jy+2].filter((x,i,a)=>a.indexOf(x)===i).map(y=>'<option value="'+y+'">'+fa(y)+'</option>').join('');
  sM.innerHTML=JMONTHS.map((m,i)=>'<option value="'+(i+1)+'">'+m+'</option>').join('');
  function fillD(){ const len=jMonthLen(+sY.value,+sM.value); sD.innerHTML=Array.from({length:len},(_,i)=>'<option value="'+(i+1)+'">'+fa(i+1)+'</option>').join(''); }
  sY.value=base.jy; sM.value=base.jm; fillD(); sD.value=Math.min(base.jd, jMonthLen(+sY.value,+sM.value));
  sY.onchange=sM.onchange=fillD;

  $('#al-save').onclick=()=>{
    const title=$('#al-title').value.trim();
    if(!title){ toast('عنوان اعلان را بنویس','info'); $('#al-title').focus(); return; }
    const serial=j2d(+sY.value,+sM.value,+sD.value);
    const time=$('#al-time').value||'09:00';
    const epoch=alertEpoch(serial,time);
    if(epoch<Date.now()-60000){ toast('این زمان گذشته است؛ تاریخ/ساعت دیگری انتخاب کن','info'); return; }
    if(editing){
      editing.title=title; editing.desc=$('#al-desc').value.trim(); editing.serial=serial; editing.time=time; editing.epoch=epoch; editing.enabled=true; delete editing.fired;
      syncAlert(editing); alertEditId=null; toast('اعلان به‌روزرسانی شد');
    } else {
      const a={id:uid(), title, desc:$('#al-desc').value.trim(), serial, time, epoch, enabled:true, createdAt:Date.now()};
      state.alerts.push(a); syncAlert(a); toast('اعلان ساخته شد','bell');
    }
    save(); renderAlerts();
  };
  const ac=$('#al-cancel'); if(ac) ac.onclick=()=>{ alertEditId=null; renderAlerts(); };
  $('#al-perm').onclick=requestAlertPermission;
  $('#al-exact').onclick=requestExactAlarmPermission;

  $$('[data-aon]').forEach(b=>b.onclick=()=>{ const a=state.alerts.find(x=>x.id===b.dataset.aon); if(!a)return;
    a.enabled=!a.enabled; syncAlert(a); save(); renderAlerts(); toast(a.enabled?'اعلان فعال شد':'اعلان غیرفعال شد'); });
  $$('[data-aedit]').forEach(b=>b.onclick=()=>{ alertEditId=b.dataset.aedit; renderAlerts(); window.scrollTo({top:0,behavior:'smooth'}); });
  $$('[data-adel]').forEach(b=>b.onclick=async ()=>{ const a=state.alerts.find(x=>x.id===b.dataset.adel); if(!a)return;
    if(await modal({title:'حذف اعلان', msg:'«'+a.title+'» حذف شود؟', danger:true, okTxt:'حذف'})){
      ncall('cancelAlert', String(a.id));
      state.alerts=state.alerts.filter(x=>x.id!==a.id); save(); renderAlerts(); toast('اعلان حذف شد','trash');
    }});
}
window.renderAlerts=renderAlerts;

/* ---------- 4) فونت محلی وزیرمتن ---------- */
function addCdnFontFallback(){
  if(document.getElementById('vazi-cdn')) return;
  try{
    const l=document.createElement('link'); l.id='vazi-cdn'; l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap';
    document.head.appendChild(l);
  }catch(e){}
}
function loadLocalFonts(){
  const faces=[
    {w:400,f:'Vazirmatn-Regular.woff2'},{w:500,f:'Vazirmatn-Medium.woff2'},{w:700,f:'Vazirmatn-Bold.woff2'}
  ];
  const css=faces.map(x=>"@font-face{font-family:'Vazirmatn';font-style:normal;font-weight:"+x.w+";font-display:swap;src:url('assets/fonts/"+x.f+"') format('woff2')}").join('\n');
  const inject=()=>{ if(document.getElementById('vazi-local')) return; const st=document.createElement('style'); st.id='vazi-local'; st.textContent=css; document.head.appendChild(st); };
  try{
    fetch('assets/fonts/Vazirmatn-Regular.woff2',{method:'HEAD'}).then(r=>{
      if(r.ok) inject(); else if(location.protocol==='http:'||location.protocol==='https:') addCdnFontFallback();
    }).catch(()=>{ if(location.protocol==='http:'||location.protocol==='https:') addCdnFontFallback(); });
  }catch(e){ if(location.protocol==='http:'||location.protocol==='https:') addCdnFontFallback(); }
}

/* ---------- 5) Service Worker برای نسخه وب آفلاین ---------- */
function registerSW(){
  if(!(location.protocol==='http:'||location.protocol==='https:')) return;
  if(!('serviceWorker' in navigator)) return;
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}

/* ---------- 6) راه‌اندازی لایه افزوده ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  try{
    if(typeof state==='undefined' || !state) return;
    if(!state.alerts) state.alerts=[];
    loadLocalFonts();
    registerSW();
    /* بازیابی اعلان‌ها و تایمرها از سمت اندروید */
    state.alerts.forEach(a=>{ try{ a.epoch=alertEpoch(a.serial,a.time); syncAlert(a); }catch(e){} });
    setTimeout(()=>{ try{ syncFromNative(); }catch(e){} }, 400);
    checkWebAlerts();
  }catch(e){ try{ console.warn('bridge init', e); }catch(_){} }
});
})();
</script>
</body>
